<!DOCTYPE html>
<html>
<head>
    <title>Process DIDs in a batch processing manner</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 150px; font-weight: bold; }
        input[type="text"] { width: 300px; padding: 5px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .progress { margin: 20px 0; }
        progress { width: 100%; height: 20px; }
        .results { margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .success { color: green; }
        .error { color: red; }
        .hidden { display: none; }
        #recentResults { 
            background-color: #f5f5f5; 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Process DIDs in a batch processing manner</h1>
    
    <div class="form-container">
        <div class="form-group">
            <label for="base_url">Base URL:</label>
            <input type="text" id="base_url" required>
        </div>
        <div class="form-group">
            <label for="seller_id">Seller ID:</label>
            <input type="text" id="seller_id" required>
        </div>
        <div class="form-group">
            <label for="api_key">API Key:</label>
            <input type="text" id="api_key" required>
        </div>
        <div class="form-group">
            <label for="target_variant_id">Target Variant ID:</label>
            <input type="text" id="target_variant_id" required>
        </div>
        <button onclick="startCheck()" id="startBtn">Proceed</button>
    </div>
    
    <div id="progressSection" class="hidden">
        <h3>Progress</h3>
        <div class="progress">
            <progress id="progressBar" value="0" max="100"></progress>
            <div id="progressText">0% (0/0)</div>
        </div>
        <div id="recentResults"></div>
    </div>
    
    <div id="resultsSection" class="hidden">
        <h3>Outcome</h3>
        <button onclick="exportResults()">Export Outcome</button>
        <button onclick="retryFailed()" id="retryBtn">Retry</button>
        <table id="resultsTable">
            <thead>
                <tr>
                    <th>Row</th>
                    <th>DID</th>
                    <th>State</th>
                    <th>Operation</th>
                    <th>Message</th>
                </tr>
            </thead>
            <tbody id="resultsBody">
            </tbody>
        </table>
    </div>

    <script>
        let currentTaskId = null;
        let allResults = [];
        
        function startCheck() {
            const base_url = document.getElementById('base_url').value;
            const seller_id = document.getElementById('seller_id').value;
            const api_key = document.getElementById('api_key').value;
            const target_variant_id = document.getElementById('target_variant_id').value;
            
            if (!base_url || !seller_id || !api_key || !target_variant_id) {
                alert('Please fill in all required fields.');
                return;
            }
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('progressSection').classList.remove('hidden');
            
            // 重置结果
            allResults = [];
            updateResultsTable();
            
            fetch('/check-devices/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    base_url: base_url,
                    seller_id: seller_id,
                    api_key: api_key,
                    target_variant_id: target_variant_id
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'started') {
                    currentTaskId = data.task_id;
                    checkProgress();
                } else {
                    alert('Failed to start: ' + data.message);
                    document.getElementById('startBtn').disabled = false;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('startBtn').disabled = false;
            });
        }
        
        function checkProgress() {
            if (!currentTaskId) return;
            
            fetch(`/get-progress/?task_id=${currentTaskId}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'processing' || data.status === 'completed') {
                    // 更新进度条
                    const progress = data.progress;
                    const percent = progress.total > 0 ? (progress.current / progress.total) * 100 : 0;
                    document.getElementById('progressBar').value = percent;
                    document.getElementById('progressText').textContent = 
                        `${percent.toFixed(1)}% (${progress.current}/${progress.total})`;
                    
                    // 更新全部结果
                    if (data.results && data.results.length > 0) {
                        allResults = data.results;
                        updateResultsTable();
                    }
                    
                    // 显示最近结果（仅用于进度显示，不影响主表格）
                    updateRecentResults(data.results);
                    
                    if (data.status === 'processing') {
                        // 继续检查进度
                        setTimeout(checkProgress, 1000);
                    } else if (data.status === 'completed') {
                        document.getElementById('progressText').textContent += ' - Completed';
                        document.getElementById('resultsSection').classList.remove('hidden');
                        document.getElementById('startBtn').disabled = false;
                        
                        // 如果有失败项，显示重试按钮
                        const hasFailed = allResults.some(r => r.status === 'error');
                        document.getElementById('retryBtn').style.display = hasFailed ? 'inline-block' : 'none';
                    }
                } else if (data.status === 'error') {
                    alert('Error: ' + data.message);
                    document.getElementById('startBtn').disabled = false;
                }
            })
            .catch(error => {
                console.error('Error checking progress:', error);
                setTimeout(checkProgress, 2000); // 2秒后重试
            });
        }
        
        function updateRecentResults(results) {
            const container = document.getElementById('recentResults');
            if (!results || results.length === 0) return;
            
            // 只显示最近5条作为进度参考
            const recent = results.slice(-5);
            container.innerHTML = '<h4>Recent Operations:</h4>' + 
                recent.map(r => 
                    `<div class="${r.status}">${r.device_id} - ${r.status} - ${r.action}</div>`
                ).join('');
        }
        
        function updateResultsTable() {
            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';
            
            // 显示全部结果
            allResults.forEach(result => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${result.row}</td>
                    <td>${result.device_id}</td>
                    <td class="${result.status}">${result.status}</td>
                    <td>${result.action}</td>
                    <td>${result.message}</td>
                `;
                tbody.appendChild(row);
            });
            
            // 添加统计信息
            const successCount = allResults.filter(r => r.status === 'success').length;
            const errorCount = allResults.filter(r => r.status === 'error').length;
            const totalCount = allResults.length;
            
            // 在表格底部添加统计行
            const statsRow = document.createElement('tr');
            statsRow.style.backgroundColor = '#f9f9f9';
            statsRow.innerHTML = `
                <td colspan="2"><strong>Statistics</strong></td>
                <td><strong>Sum: ${totalCount}</strong></td>
                <td><strong>Success: ${successCount}</strong></td>
                <td><strong>Failed: ${errorCount}</strong></td>
            `;
            tbody.appendChild(statsRow);
        }
        
        function exportResults() {
            if (!currentTaskId) {
                alert('There is no task to export results for.');
                return;
            }
            window.open(`/export-results/?task_id=${currentTaskId}`);
        }
        
        function retryFailed() {
            const failedDevices = allResults
                .filter(r => r.status === 'error')
                .map(r => ({ device_id: r.device_id, row: r.row }));
            
            if (failedDevices.length === 0) {
                alert('No failed devices to retry.');
                return;
            }
            
            const base_url = document.getElementById('base_url').value;
            const seller_id = document.getElementById('seller_id').value;
            const api_key = document.getElementById('api_key').value;
            const target_variant_id = document.getElementById('target_variant_id').value;
            
            fetch('/retry-failed/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    failed_devices: failedDevices,
                    base_url: base_url,
                    seller_id: seller_id,
                    api_key: api_key,
                    target_variant_id: target_variant_id
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'completed') {
                    // 更新结果
                    data.results.forEach(newResult => {
                        const index = allResults.findIndex(r => 
                            r.device_id === newResult.device_id && r.row === newResult.row
                        );
                        if (index !== -1) {
                            allResults[index] = newResult;
                        }
                    });
                    updateResultsTable();
                    
                    // 检查是否还有失败项
                    const hasFailed = allResults.some(r => r.status === 'error');
                    document.getElementById('retryBtn').style.display = hasFailed ? 'inline-block' : 'none';
                    
                    alert('retry completed');
                } else {
                    alert('retry failed: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Retry request failed');
            });
        }
        
        // 获取CSRF token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
