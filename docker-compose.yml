services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-factory_testing}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-mengmeng.plus,www.mengmeng.plus,43.135.3.78,localhost}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-factory_testing}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - static_files:/app/staticfiles
    networks:
      - internal
      - shared_proxy

networks:
  internal:
  shared_proxy:
    name: shared_proxy
    driver: bridge

volumes:
  mysql_data:
  static_files:
