{% comment %}top navigation bar with user info — dark frosted glass{% endcomment %}
<header class="h-14 glass-topbar border-b border-white/5 flex items-center justify-between px-6 sticky top-0 z-30">
  <!-- hamburger (mobile only) -->
  <button onclick="toggleSidebar()" class="lg:hidden text-dark-400 hover:text-white transition">
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>
  <div class="hidden lg:block"></div>
  <div class="relative" id="user-dropdown-wrap">
    <button onclick="document.getElementById('user-menu').classList.toggle('hidden')"
            class="flex items-center gap-3 hover:opacity-90 transition">
      <div class="text-right hidden sm:block">
        <p class="text-sm font-medium text-white leading-tight">{{ first_name }} {{ last_name }}</p>
        <p class="text-[11px] text-dark-400 leading-tight">{{ email }}</p>
      </div>
      <svg class="w-4 h-4 text-dark-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>

    <div id="user-menu"
         class="hidden absolute right-0 top-full mt-1 w-56 rounded-xl bg-dark-900 border border-dark-700 shadow-xl z-50 py-2 animate-slide-up">
      <div class="px-4 py-2 border-b border-dark-700">
        <p class="text-xs text-dark-400 truncate">{{ email }}</p>
      </div>
      <a href="{% url 'tbft_logout' %}"
         class="flex items-center gap-2 px-4 py-2.5 text-sm text-red-400 hover:bg-dark-800 transition">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        Sign Out
      </a>
    </div>
  </div>
</header>

<script>
document.addEventListener('click', function(e) {
  const wrap = document.getElementById('user-dropdown-wrap');
  const menu = document.getElementById('user-menu');
  if (wrap && menu && !wrap.contains(e.target)) {
    menu.classList.add('hidden');
  }
});
</script>
