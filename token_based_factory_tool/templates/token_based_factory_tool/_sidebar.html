{% comment %}sidebar partial — dark frosted glass, responsive{% endcomment %}

<!-- mobile overlay -->
<div id="sidebar-overlay" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-black/50 z-40 lg:hidden"></div>

<aside id="sidebar"
       class="fixed inset-y-0 left-0 z-50 w-64 glass-sidebar text-white flex flex-col border-r border-white/5
              -translate-x-full lg:translate-x-0 lg:static lg:z-auto transition-transform duration-200">

  <!-- brand -->
  <div class="h-14 px-6 flex items-center border-b border-white/5 justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-primary-600 flex items-center justify-center flex-shrink-0">
        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2
                   M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2z
                   M9 9h6v6H9V9z"/>
        </svg>
      </div>
      <p class="text-sm font-bold leading-tight">Factory Tool</p>
    </div>
    <!-- close button (mobile only) -->
    <button onclick="toggleSidebar()" class="lg:hidden text-dark-400 hover:text-white transition">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- nav -->
  <nav class="flex-1 px-3 py-4 space-y-1">

    <a href="{% url 'tbft_dashboard' %}"
       class="sidebar-link {% if active == 'dashboard' %}active{% else %}text-dark-300{% endif %}">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3
                 m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      <span>Sellers / Products</span>
    </a>

    <a href="{% url 'tbft_operations' %}"
       class="sidebar-link {% if active == 'operations' %}active{% else %}text-dark-300{% endif %}">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826
                 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0
                 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426
                 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724
                 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543
                 .826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <span>Operations</span>
    </a>
  </nav>
</aside>

<script>
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('-translate-x-full');
  document.getElementById('sidebar-overlay').classList.toggle('hidden');
}
</script>
