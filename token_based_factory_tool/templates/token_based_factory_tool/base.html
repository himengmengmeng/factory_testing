<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Factory Testing Tool{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50:'#f0f7ff',100:'#e0effe',200:'#bae0fd',300:'#7dc8fc',
              400:'#38aaf8',500:'#0e8de9',600:'#026fc7',700:'#0359a1',
              800:'#074b85',900:'#0c3f6e',950:'#082849',
            },
            dark: {
              50:'#f6f6f7',100:'#e2e3e5',200:'#c4c6cb',300:'#9fa2a9',
              400:'#7a7e87',500:'#5f636c',600:'#4b4e56',700:'#3e4147',
              800:'#35373c',900:'#1e1f23',950:'#121316',
            },
          },
          fontFamily: {
            sans: ['DM Sans','system-ui','-apple-system','sans-serif'],
            display: ['DM Sans','system-ui','-apple-system','sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn .5s ease-out',
            'slide-up': 'slideUp .4s ease-out',
            'slide-in-left': 'slideInLeft .3s ease-out',
          },
          keyframes: {
            fadeIn:      { '0%': { opacity:'0' }, '100%': { opacity:'1' } },
            slideUp:     { '0%': { opacity:'0', transform:'translateY(20px)' }, '100%': { opacity:'1', transform:'translateY(0)' } },
            slideInLeft: { '0%': { opacity:'0', transform:'translateX(-20px)' }, '100%': { opacity:'1', transform:'translateX(0)' } },
          },
        },
      },
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <style>
    .sidebar-link {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .sidebar-link:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .sidebar-link.active { background: rgba(2,111,199,0.2); color: #38aaf8; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-dark-50 font-sans antialiased">
  {% block body %}{% endblock %}

  <script>
    function getCsrf(){
      const c=document.cookie.split(';').find(c=>c.trim().startsWith('csrftoken='));
      return c?decodeURIComponent(c.split('=')[1]):'';
    }
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
